<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Task Manager</h1>
    <button id="theme-toggle" class="ghost" type="button" aria-label="Switch light or dark theme">Dark mode</button>
  </header>

  <div class="layout">
    <!-- Left side: form + stats -->
    <aside class="side">
      <section class="panel">
        <h2 id="form-title">New task</h2>
        <div id="task-form">
          <label for="title">Title</label>
          <input id="title" type="text" maxlength="80" placeholder="What needs to be done?">

          <label for="description">Details</label>
          <textarea id="description" rows="3" maxlength="300" placeholder="Optional notes"></textarea>

          <div class="row">
            <div>
              <label for="due">Due date</label>
              <input id="due" type="date">
            </div>
            <div>
              <label for="priority">Priority</label>
              <select id="priority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </div>
          </div>

          <p id="form-error" class="error" role="alert"></p>

          <div class="row buttons">
            <button id="save-btn" class="primary" type="button">Add task</button>
            <button id="cancel-btn" class="ghost" type="button" hidden>Cancel</button>
          </div>
        </div>
      </section>

      <section class="panel stats">
        <h2>Progress</h2>
        <p class="big"><span id="stat-done">0</span> of <span id="stat-total">0</span> done</p>
        <div class="bar" aria-hidden="true"><div id="bar-fill"></div></div>
        <p class="muted"><span id="stat-overdue">0</span> overdue</p>
      </section>
    </aside>

    <!-- Right side: list -->
    <main class="main">
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search tasks" aria-label="Search tasks">
        <select id="sort" aria-label="Sort tasks">
          <option value="newest">Newest first</option>
          <option value="due">Due date</option>
          <option value="priority">Priority</option>
        </select>
      </div>

      <div class="filters" role="group" aria-label="Filter tasks">
        <button class="filter active" data-filter="all" type="button">All</button>
        <button class="filter" data-filter="active" type="button">Remaining</button>
        <button class="filter" data-filter="done" type="button">Completed</button>
      </div>

      <ul id="task-list" class="list"></ul>
      <p id="empty" class="empty" hidden></p>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
